name: parsho

channels:
  - conda-forge
  - nodefaults

dependencies:
  - python=3.12
  - pip
  - numpy>=1.24
  - scipy>=1.10
  - scikit-image>=0.26
  - matplotlib>=3.7
  - tifffile>=2023.7.10
  - pillow>=10
  - pandas
  - jupyterlab
  - ipykernel
  - ipywidgets>=8,<9
  - pip:
      - cellpose>=4,<5
      - -e .[microscopy-io]
